name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Cloudflare environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: "deploy-${{ github.event.inputs.environment || 'production' }}"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (${{ github.event.inputs.environment || 'production' }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ (github.event.inputs.environment == 'staging') && 'https://staging-registry.skillapt.dev' || 'https://registry.skillapt.dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inform missing Cloudflare secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice ::CLOUDFLARE_API_TOKEN is not configured in repository secrets. Worker deployment skipped. To enable deployments, configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in environment secrets."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
