name: Crawl GitHub for skills

# Runs daily and can be started by hand. It indexes metadata and source links only.
# It does nothing until the REGISTRY_URL variable and REGISTRY_ADMIN_TOKEN secret are set.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Send results to the registry (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN || github.token }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_ADMIN_TOKEN: ${{ secrets.REGISTRY_ADMIN_TOKEN }}
          MAX_ITEMS: "1000"
        run: |
          if [ -n "$REGISTRY_URL" ] && [ -n "$REGISTRY_ADMIN_TOKEN" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; }; then
            node scripts/crawl-github.mjs --apply
          else
            node scripts/crawl-github.mjs
          fi
