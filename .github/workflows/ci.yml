name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Test, Audit, Deploy Check, Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run

      - name: Workerd smoke test
        run: pnpm smoke

      - name: Workerd integration tests
        run: pnpm test:integration

  conformance:
    name: CLI Contract Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout registry repository
        uses: actions/checkout@v7
        with:
          path: registry

      - name: Checkout CLI repository (if available)
        uses: actions/checkout@v7
        with:
          repository: Ankur17nith/skillapt
          ref: v1.0.0
          path: skillapt
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: registry/package.json

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: registry/pnpm-lock.yaml

      - name: Run CLI Conformance Test
        run: |
          if [ -d "skillapt" ] && [ -f "skillapt/package.json" ]; then
            cd skillapt
            # The CLI repository is npm-based (package-lock.json).
            npm ci
            npm run build
            cd ../registry
            pnpm install --frozen-lockfile
            SKILLAPT_CLI_DIR=$GITHUB_WORKSPACE/skillapt pnpm conformance
          else
            echo "CLI repository checkout not available; skipping conformance job cleanly."
          fi
